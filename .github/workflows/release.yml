name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run tests
        run: go test -v -race ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build gateway
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags "-s -w" -o gateway ./cmd/gateway

      - name: Build TUI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags "-s -w" -o gateway-tui ./cmd/tui

      - name: Package
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          ARCHIVE="amg-rfid-gateway-${VERSION}-${{ matrix.suffix }}"
          mkdir -p "${ARCHIVE}"
          cp gateway "${ARCHIVE}/"
          cp gateway-tui "${ARCHIVE}/"
          cp configs/config.example.yaml "${ARCHIVE}/"
          tar czf "${ARCHIVE}.tar.gz" "${ARCHIVE}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: amg-rfid-gateway-${{ matrix.suffix }}
          path: amg-rfid-gateway-*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum amg-rfid-gateway-*.tar.gz > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            amg-rfid-gateway-*.tar.gz
            checksums.txt

  update-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download checksums from release
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          curl -sL "https://github.com/${{ github.repository }}/releases/download/${VERSION}/checksums.txt" -o checksums.txt
          cat checksums.txt

      - name: Extract checksums
        id: checksums
        run: |
          AMD64_SHA=$(grep linux-amd64 checksums.txt | awk '{print $1}')
          ARM64_SHA=$(grep linux-arm64 checksums.txt | awk '{print $1}')
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION_NUM=${VERSION#v}
          echo "amd64_sha=$AMD64_SHA" >> $GITHUB_OUTPUT
          echo "arm64_sha=$ARM64_SHA" >> $GITHUB_OUTPUT
          echo "version=$VERSION_NUM" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: AMG-Repo/homebrew-tap
          token: ${{ secrets.RELEASE_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        env:
          VERSION: ${{ steps.checksums.outputs.version }}
          TAG: ${{ steps.checksums.outputs.tag }}
          ARM64_SHA: ${{ steps.checksums.outputs.arm64_sha }}
          AMD64_SHA: ${{ steps.checksums.outputs.amd64_sha }}
        run: |
          cat > homebrew-tap/Formula/amg-rfid-gateway.rb << EOF
          class AmgRfidGateway < Formula
            desc "AMG RFID Edge Gateway — syncs RFID readings from antennas to VPS"
            homepage "https://github.com/AMG-Repo/amg-rfid-gateway"
            version "$VERSION"
            license "MIT"

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/AMG-Repo/amg-rfid-gateway/releases/download/$TAG/amg-rfid-gateway-$TAG-linux-arm64.tar.gz"
                sha256 "$ARM64_SHA"
              else
                url "https://github.com/AMG-Repo/amg-rfid-gateway/releases/download/$TAG/amg-rfid-gateway-$TAG-linux-amd64.tar.gz"
                sha256 "$AMD64_SHA"
              end
            end

            def install
              bin.install "gateway"
              bin.install "tui"
              pkgetc.install "config.example.yaml" => "config.yaml"
              (var/"lib/amg-rfid-gateway").mkpath
            end

            def post_install
              ohai "AMG RFID Gateway v\#{version} installed!"
              puts <<~INFO

                Config:  \#{etc}/amg-rfid-gateway/config.yaml
                Data:    \#{var}/lib/amg-rfid-gateway

                Quick start:
                  gateway                  # auto-detects config

                Or as service:
                  brew services start AMG-Repo/tap/amg-rfid-gateway

              INFO
            end

            service do
              run [opt_bin/"gateway"]
              working_dir var/"lib/amg-rfid-gateway"
              keep_alive true
              log_path var/"log/amg-rfid-gateway.log"
              error_log_path var/"log/amg-rfid-gateway.log"
            end

            test do
              assert_match "amg-rfid-gateway", shell_output("\#{bin}/gateway --version 2>&1", 1)
            end
          end
          EOF

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update to v${{ steps.checksums.outputs.version }}" || echo "No changes"
          git push
